<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>AR名刺（準備中）</title>
<!-- 名刺のARができたら、このページをARのページに入れ替える（URLは変わらない） -->
<style>
  :root { --bg: #f4f2f0; --card: #ffffff; --ink: #2a2526; --muted: #6b6264; --line: #e3ddd9; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141213; --card: #1f1c1d; --ink: #f1ecea; --muted: #b8adab; --line: #3a3334; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  main { width: 100%; max-width: 420px; padding: 40px 24px; text-align: center; line-height: 1.9;
    background: var(--card); border: 1px solid var(--line); border-radius: 20px; }
  .icon { font-size: 40px; line-height: 1; margin-bottom: 16px; }
  h1 { margin: 0 0 16px; font-size: 22px; line-height: 1.6; }
  p { margin: 0; font-size: 16px; color: var(--muted); }
</style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">📇</div>
    <h1>AR名刺は<br>ただいま準備中です</h1>
    <p>もうしばらくお待ちください。</p>
  </main>
</body>
</html>
